version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-name: "@earendil-works/pi-*"
    groups:
      pi:
        patterns:
          - "@earendil-works/pi-*"
    commit-message:
      prefix: "chore(deps):"
