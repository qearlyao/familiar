[discord]
owner_id = "${DISCORD_OWNER_ID:-}"
allowed_channels = []

[agent]
api = "${FAMILIAR_API:-anthropic-messages}"
model_id = "${FAMILIAR_MODEL:-claude-sonnet-4-5}"
base_url = "${FAMILIAR_BASE_URL:-https://api.anthropic.com}"
api_key_env = "${FAMILIAR_API_KEY_ENV:-ANTHROPIC_API_KEY}"
provider = "${FAMILIAR_PROVIDER:-anthropic}"
cacheRetention = "${FAMILIAR_CACHE_RETENTION:-long}"
thinking_level = "${FAMILIAR_THINKING_LEVEL:-medium}"

[models]
allow = [
	"anthropic/claude-opus-4-7",
	"google/gemini-3.1-pro-preview",
	"google/gemini-3-flash-preview",
	"openai/gpt-5.5",
	"google-vertex/gemini-3.1-pro-preview",
	"google-vertex/gemini-3-flash-preview",
]

[models.base_urls]
# anthropic = "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
# google = "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}"
# openai = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
# google-vertex = "${GOOGLE_VERTEX_BASE_URL:-https://{location}-aiplatform.googleapis.com}"

[models.api_key_envs]
# anthropic = "ANTHROPIC_API_KEY"
# google = "GEMINI_API_KEY"
# openai = "OPENAI_API_KEY"
# google-vertex is optional: pi-ai also supports Vertex ADC via
# GOOGLE_APPLICATION_CREDENTIALS or gcloud ADC, plus GOOGLE_CLOUD_PROJECT and GOOGLE_CLOUD_LOCATION.
# google-vertex = "GOOGLE_CLOUD_API_KEY"

[persona]
soul = "${FAMILIAR_SOUL:-SOUL.md}"
user = "${FAMILIAR_USER:-USER.md}"
memory = "${FAMILIAR_MEMORY:-MEMORY.md}"

[workspace]
data_dir = "${FAMILIAR_DATA_DIR:-data}"
