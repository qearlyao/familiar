# Platforms are optional — with no [discord] or [qq] configured, familiar runs web-only.
# default_platform = "discord" # discord | qq | web (heartbeat/cron delivery target; defaults to first configured)

[discord]
owner_id = "YOUR_DISCORD_USER_ID"
allowed_channels = []
reply_mode = "plain" # plain | reply
chunk_mode = "newline" # simple | paragraph | newline
dm_mode = "steer" # steer | queue | collect
channel_mode = "collect" # collect | queue | steer
channel_trigger = "always" # mention | always
collect_debounce_ms = 4000
allow_bot_messages = true

# QQ via OneBot 11 (NapCat / Lagrange.OneBot). Setting ws_url enables the QQ daemon.
# Token (if the OneBot server has one) goes in env: QQ_ONEBOT_TOKEN.
# [qq]
# ws_url = "ws://127.0.0.1:3001" # OneBot forward WebSocket
# owner_id = "YOUR_QQ_NUMBER"    # required when ws_url is set
# allowed_groups = []            # group-number allowlist; empty = DMs only

[web]
port = 8787
auth_mode = "tailscale-only" # tailscale-only | bearer | public-2fa
# bearer mode uses this token as the WebUI login secret, then issues device cookies.
bearer_token = "${FAMILIAR_WEB_BEARER_TOKEN:-}"
totp_secret = "${FAMILIAR_WEB_TOTP_SECRET:-}"
# keep 127.0.0.1 when exposing through nginx/caddy on a VPS.
bind_address = "127.0.0.1"

[browser]
# Real-browser control. Use OpenCLI for site adapters/owned sessions, or
# browser-harness when you want Familiar to attach to your already-running Chrome.
enabled = false
backend = "browser-harness" # opencli | browser-harness
harness_mode = "attach" # attach | cdp | cloud
opencli_command = "opencli"
harness_command = "browser-harness"
session = "familiar"
# profile = "work"
# VPS/local headless example:
# harness_mode = "cdp"
# harness_cdp_url = "http://127.0.0.1:9222"
# harness_launch_command = "/usr/bin/google-chrome-stable"
# harness_launch_args = [
# 	"--headless=new",
# 	"--remote-debugging-address=127.0.0.1",
# 	"--remote-debugging-port=9222",
# 	"--user-data-dir=/home/familiar/.familiar/browser-harness-profile",
# 	"--no-first-run",
# 	"--no-default-browser-check",
# 	"--disable-dev-shm-usage",
# 	"about:blank",
# ]
# Browser Use cloud example:
# harness_mode = "cloud"
# harness_cloud_api_key_env = "BROWSER_USE_API_KEY"
# harness_cloud_profile_id = "YOUR_BROWSER_USE_PROFILE_ID"
# harness_cloud_timeout_minutes = 120
window = "foreground" # foreground | background
timeout_ms = 60000
max_output_chars = 12000
# Keep false until you explicitly want the agent to click/type/close sessions or run write adapters.
read_write = true

[agent]
model = "anthropic/claude-fable-5"
cache_retention = "short"
thinking_level = "medium"

[heartbeat]
enabled = false
# Before enabling, review and customize HEARTBEAT.md in the workspace.
# The first heartbeat can fire once idle time reaches idle_threshold_minutes.
# Later heartbeats repeat every interval_minutes while the DM remains idle.
# Only owner/user messages reset the idle timer; agent replies and tool work do not.
idle_threshold_minutes = 60
interval_minutes = 240

[cron]
enabled = false
poll_seconds = 60

# [[cron.jobs]]
# id = "daily-review"
# enabled = true
# frequency = "daily" # once | hourly | daily | weekly | monthly
# delivery_mode = "queue" # queue | follow_up
# time = "09:00"
# prompt = "Review today's priorities and remind me what matters."

[models]
allow = [
	"anthropic/claude-fable-5",
	"google/gemini-3.1-pro-preview",
	"google/gemini-3.5-flash",
	"openai/gpt-5.5",
	"google-vertex/gemini-3.1-pro-preview",
	"google-vertex/gemini-3.5-flash",
	"link/gpt-image-2-c",
    "link/gemini-3-pro-image-preview",
]

[models.base_urls]
anthropic = "https://api.linkapi.ai"
google = "https://api.linkapi.ai/v1beta"
openai = "https://api.linkapi.ai/v1"
# google-vertex = "https://{location}-aiplatform.googleapis.com"
link = "https://api.linkapi.ai/v1"

[models.api_key_envs]
# anthropic = "ANTHROPIC_API_KEY"
# google = "GEMINI_API_KEY"
# openai = "OPENAI_API_KEY"
# google-vertex is optional: pi-ai also supports Vertex ADC via gcloud ADC or
# GOOGLE_APPLICATION_CREDENTIALS, plus GOOGLE_CLOUD_PROJECT and GOOGLE_CLOUD_LOCATION in .env.
# google-vertex = "GOOGLE_CLOUD_API_KEY"
link = "LINK_API_KEY"

# Optional OpenRouter provider ordering for built-in Anthropic models whose
# base URL is exactly https://openrouter.ai/api. A provider/model key overrides
# the provider-wide entry.
# [models.openrouter_routing]
# anthropic = { order = ["anthropic"], allow_fallbacks = true }
# "anthropic/claude-fable-5" = { order = ["anthropic"], allow_fallbacks = false }

# Optional custom provider metadata for non-built-in providers. Use a bare
# provider name here, not a provider/model string. Keep endpoint/auth wiring in
# the flat maps above.
# [models.providers.proxy]
# api = "anthropic-messages"
# reasoning = true
# input = ["text", "image"]
# context_window = 200000
# max_tokens = 8192
# compat = { send_session_affinity_headers = true,
# supports_eager_tool_input_streaming = false,
# supports_cache_control_on_tools = false,
# force_adaptive_thinking = true }
#
# [[models.providers.proxy.models]]
# id = "claude-sonnet-4"
# max_tokens = 4096
# compat = { force_adaptive_thinking = true } # for adaptive-thinking Claude aliases

[tts]
# provider = "cartesia" switches speech to Cartesia; the flat keys below stay ElevenLabs settings.
provider = "elevenlabs"
api_key_env = "ELEVENLABS_API_KEY"
voice_id = "${ELEVENLABS_VOICE_ID:-}"
model_id = "eleven_v3"
output_format = "mp3_44100_128"
max_input_chars = 5000

[tts.cartesia]
api_key_env = "CARTESIA_API_KEY"
voice_id = "${CARTESIA_VOICE_ID:-}"
model_id = "sonic-3.5"

[tts.voice_settings]
# ElevenLabs v2/v2.5 voice settings. For eleven_v3, Familiar sends only stability and omits v2-only fields.
stability = 0.5
similarity_boost = 0.75
style = 0
speed = 1
use_speaker_boost = true

[image_gen]
enabled = true
api = "openrouter-images"
model = "link/gpt-image-2-c"
fallback_model = "link/gemini-3-pro-image-preview"
timeout_ms = 120000

[media.generated]
retention_days = 30

[data.chat]
retention_days = 0

[data.transcripts]
# Transcripts are the canonical raw history for restart replay; retain them unless loss is intentional.
retention_days = 0

[data.payloads]
retention_days = 7

[media.understanding.audio]
provider = "groq"
model = "whisper-large-v3"
api_key_env = "GROQ_API_KEY"

[media.understanding.video]
provider = "google"
model = "gemini-3-flash-preview"
# Optional video-only Gemini endpoint. Use this when [models.base_urls].google points at
# a gateway that does not support Gemini Files API uploads.
# base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"

[persona]
soul = "SOUL.md"
user = "USER.md"
contact = "CONTACT.md"
memory = "MEMORY.md"

[workspace]
data_dir = "data"

[memory]
root_dir = "memories"

[memory.embedding]
# Embedding wire format: gemini, openai, or voyage. v0 implements gemini only.
format = "gemini"
provider = "google"
model = "gemini-embedding-2"
# base_url and api_key_env inherit from [models.*], then fall back to provider defaults.
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# api_key_env = "GEMINI_API_KEY"
dimensions = 3072
batch_size = 32

[memory.ambient]
# Set enabled = false to pause automatic diary recall injection.
# Manual memory_recall and memory_open tools still work when ambient is disabled.
enabled = true

top_k = 3
min_query_length = 8
throttle_seconds = 30
weight_similarity = 1.0
weight_valence = 0.08
weight_recency = 0.08
weight_intensity = 0.1

[memory.lcm]

# Lossless-claw style LCM. Set enabled = false to disable the LCM context engine.
enabled = true

# Omit model to inherit [agent].model, or set an explicit provider/model ref.
# model = "google/gemini-3.5-flash"

# Connection settings inherit from [models.base_urls] and [models.api_key_envs].
context_threshold = 0.75

# Protect up to this many newest messages before LCM compacts older context.
fresh_tail_count = 100

# Optional stricter token cap for the protected fresh tail; the smaller tail wins.
# fresh_tail_max_tokens = 4000

leaf_chunk_tokens = 14000
leaf_target_tokens = 1000

prompt_aware_eviction_enabled = true
condense_group_size = 4

max_summary_depth = 2

# Context retained after /new. -1 keeps all context, 0 keeps all summaries,
# and positive values keep summaries at that depth or higher; 2 keeps d2+.
new_session_retain_depth = 2

max_rounds = 10

# Milliseconds before cached LCM summaries expire.
cache_ttl_ms = 300000

# Minimum remaining TTL before touching cached LCM summaries.
cache_touch_slack_ms = 30000

# Token overflow above which LCM runs even when context_threshold has not been reached.
critical_overflow_tokens = 8000

timeout_ms = 60000

# prompt = "Inline extra instruction appended to every LCM summary prompt."
# prompt_path = "prompts/lcm-summary.md"
# system_prompt = "Inline system prompt that replaces the default LCM summarizer system prompt."
# system_prompt_path = "prompts/lcm-system.md"
