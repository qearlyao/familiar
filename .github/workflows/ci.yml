name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci

      # Native deps such as better-sqlite3 and sharp should build on ubuntu-latest with Node 22.
      - run: npm ci --prefix web

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
